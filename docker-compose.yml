# R0 Docker構成（04-rails-implementation-plan.md R0-2 / 03-rails-architecture-proposal.md 技術スタック表）。
# ftlogのdocker-compose.yml（db/web/tailwind/worker）を土台に、mailpit（LaravelのDockerサービス）を追加した5サービス構成。
name: brige_crm

services:
  db:
    # 全文検索用に pg_bigm を同梱したカスタムイメージ（db/Dockerfile。ftlog踏襲）
    build: ./db
    environment:
      POSTGRES_USER: brige_crm
      POSTGRES_PASSWORD: brige_crm_password
      POSTGRES_DB: brige_crm_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brige_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    command: ./bin/rails server -b 0.0.0.0
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: brige_crm
      POSTGRES_PASSWORD: brige_crm_password
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      BUNDLE_WITHOUT: ""
      SMTP_ADDRESS: mailpit
      SMTP_PORT: 1025
    volumes:
      - .:/rails
      - storage:/rails/storage
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Tailwind CSS watcher（Nodeレス。tailwindcss-rails付属のCLIバイナリを使用）
  tailwind:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    # `[always]` 必須: tailwindcss-rails の watch は既定でTTYが無いと即終了する（compose upは
    # 非TTYのためコンテナが起動直後に落ち、CSSが更新されなくなる）。always指定でTTY無しでも
    # 常駐させる（2026-08-20 の「画面が素のHTMLになる」不具合の一因）。
    command: bin/rails tailwindcss:watch[always]
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: brige_crm
      POSTGRES_PASSWORD: brige_crm_password
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      BUNDLE_WITHOUT: ""
    volumes:
      - .:/rails
    depends_on:
      db:
        condition: service_healthy

  # Solid Queue worker
  worker:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    command: bin/jobs
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_USER: brige_crm
      POSTGRES_PASSWORD: brige_crm_password
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      BUNDLE_WITHOUT: ""
      # メール送信は ActionMailer::MailDeliveryJob 経由でこの worker が実行するため、
      # web と同じ SMTP 接続先が必須。未設定だと development.rb の既定 localhost:1025 に
      # フォールバックし、raise_delivery_errors=false のため無言で送信失敗する。
      SMTP_ADDRESS: mailpit
      SMTP_PORT: 1025
    volumes:
      - .:/rails
    depends_on:
      db:
        condition: service_healthy

  # 開発用SMTPキャッチャー（Devise/OTPメールの確認用。Laravel側composeから移植）
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

volumes:
  postgres_data:
  storage:
