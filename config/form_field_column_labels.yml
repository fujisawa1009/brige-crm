# フォームビルダー（Admin::FormTemplates）の日本語ラベルカタログ。
# 出所: requirements/design/Column.md の customers(§8) / stores(§9) / orders(§10) /
# order_work_details(§11) 各節「カラム一覧」表の「説明」列を転記（独自の翻訳・意訳はしない）。
# 例外: order.product_option_ids / order.product_initial_fee_id は
# FormField::EXTRA_ALLOWED_COLUMNS 由来の集合idsライター/選択枠のため、決定者確定仕様の固定文言を使う。
#
# 読み込みは app/services/form_field/column_label_catalog.rb（キャッシュ付き）。
# target_table=customer/store/order/order_work_detail それぞれ、
# FormField.allowed_target_columns_for(テーブルキー) が返す全カラムを網羅する
# （spec/models/form_field/column_label_catalog_spec.rb が漏れを検知する）。

